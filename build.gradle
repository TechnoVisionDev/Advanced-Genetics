plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name
repositories { mavenCentral(); maven { url = 'https://maven.blamejared.com' } }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    clienttest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        java.exclude '**/*ClientTest.java'
        resources.exclude 'fabric.mod.json'
    }
}
configurations {
    clienttestImplementation.extendsFrom implementation
    clienttestRuntimeOnly.extendsFrom runtimeOnly
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = project.neo_version
    runs {
        clientSmoke { client(); sourceSet = sourceSets.clienttest; gameDirectory = file("run-neoforge/client-smoke"); systemProperty "advancedgenetics.smoke", "true" }
        client { client(); gameDirectory = file('run-neoforge/client') }
        server { server(); programArgument '--nogui'; gameDirectory = file('run-neoforge/server') }
        gameTestServer { sourceSet = sourceSets.gametest; type = 'gameTestServer'; gameDirectory = file('run-neoforge/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces', 'advancedgenetics' }
    }
    mods { advancedgenetics { sourceSet sourceSets.main }; advancedgenetics_test { sourceSet sourceSets.gametest }; advancedgenetics_clienttest { sourceSet sourceSets.clienttest } }
    unitTest { enable(); testedMod = mods.advancedgenetics; loadedMods = [mods.advancedgenetics] }
}
dependencies {
    implementation "vazkii.patchouli:patchouli-neoforge:${project.patchouli_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
test {
    useJUnitPlatform()
    systemProperty "advancedgenetics.resources", file("src/main/resources").absolutePath
    doFirst { systemProperty "advancedgenetics.minecraftJar", sourceSets.main.compileClasspath.files.find { it.name == "minecraft-patched-${project.neo_version}.jar" }.absolutePath }
}
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
tasks.register('writeCompileClasspath') {
    doLast { layout.buildDirectory.file('compile-classpath.txt').get().asFile.text = sourceSets.main.compileClasspath.asPath }
}
// Use the project's Java 25 toolchain for asset acquisition as well.
tasks.named('downloadAssets') {
    javaExecutable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath }
}

neoForge.runs.client.loadedMods = [neoForge.mods.advancedgenetics]
neoForge.runs.server.loadedMods = [neoForge.mods.advancedgenetics]
neoForge.runs.gameTestServer.loadedMods = [neoForge.mods.advancedgenetics, neoForge.mods.advancedgenetics_test]
neoForge.runs.clientSmoke.loadedMods = [neoForge.mods.advancedgenetics, neoForge.mods.advancedgenetics_clienttest]

// Prevent an empty or unloaded test mod from producing a false-positive run.
tasks.named('runGameTestServer') {
    doLast {
        def log = file('run-neoforge/gametest/logs/latest.log').text
        if (!log.contains('All 20 required tests passed')) throw new GradleException('Expected all 19 Advanced Genetics GameTests plus the vanilla test to pass.')
    }
}
tasks.named('runClientSmoke') {
    doLast {
        def log = file('run-neoforge/client-smoke/logs/latest.log').text
        if (!log.contains('ADVANCED_GENETICS_CLIENT_SMOKE_PASS:')) throw new GradleException('Client validation did not complete successfully.')
    }
}
